<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: left rail on wide screens, top bar + bottom tab bar on phones; one calm column of content. Moss green leads. */
:root{
  --paper:#EDF1E4; --surface:#FAFCF5; --sunk:#E0E7D0; --ink:#1E2A17; --muted:#56634B;
  --sage:#4A6A22; --sage-soft:#DAE5C1; --slate:#56697A; --slate-soft:#E1E7EA;
  --ok:#2F6B2C; --ok-soft:#D7EBCC; --err:#A0482E; --err-soft:#F6DDD3; --line:#CBD4BB;
  --on-accent:#FFFFFF; --shadow:0 1px 2px rgb(30 42 23 / .06), 0 6px 20px rgb(30 42 23 / .06);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --moss-wash:#B9C98F; --plain-wash:#EDF1E4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A10; --surface:#1C2418; --sunk:#26301F; --ink:#E4EBD7; --muted:#A2AE93;
    --sage:#9CC060; --sage-soft:#2E3D20; --slate:#A9B8C4; --slate-soft:#283037;
    --ok:#9DD08A; --ok-soft:#22361E; --err:#EBA389; --err-soft:#43271D; --line:#34402A;
    --on-accent:#132009; --shadow:none; --moss-wash:#26331A; --plain-wash:#141A10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A10; --surface:#1C2418; --sunk:#26301F; --ink:#E4EBD7; --muted:#A2AE93;
  --sage:#9CC060; --sage-soft:#2E3D20; --slate:#A9B8C4; --slate-soft:#283037;
  --ok:#9DD08A; --ok-soft:#22361E; --err:#EBA389; --err-soft:#43271D; --line:#34402A;
  --on-accent:#132009; --shadow:none; --moss-wash:#26331A; --plain-wash:#141A10; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs,100%)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:6px}
h1:focus{outline:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;flex:none}

/* Shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:26px;padding:26px 14px 20px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}
.brand-mark{width:38px;height:38px;flex:none;display:block;border-radius:50%;background:var(--sage-soft);transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.brand:hover .brand-mark,body.moss .brand-mark{transform:rotate(-10deg) scale(1.06)}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap}
.navlist{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;border:0;background:none;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:500;text-align:left}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--sage-soft);color:var(--ink);font-weight:600}
.nav[aria-current="page"] .ico{color:var(--sage)}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:0 8px;font-size:.88rem;color:var(--muted)}
.dispbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;color:var(--ink);font-weight:500}
.dispbtn:hover{border-color:var(--sage)}
.whoami{margin:0;font-size:.88rem;color:var(--muted)} .whoami b{color:var(--ink);font-weight:600}
main{min-width:0;padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto}
.topbar,.tabbar{display:none}
.nav .chev{margin-left:auto;width:18px;height:18px;transition:transform .2s}
.nav[aria-expanded="true"] .chev{transform:rotate(180deg)}
.navsub{list-style:none;margin:2px 0 4px;padding:0 0 0 14px;display:grid;gap:3px;border-left:2px solid var(--line);margin-left:22px}
.navsub .nav{min-height:42px}
.morepop{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px;min-width:190px}
.morepop .nav{min-height:48px}
/* Game */
.gamewrap{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#1b1b1f;aspect-ratio:16/10;max-height:80vh;width:100%}
.gamewrap.tall{aspect-ratio:auto;height:min(88vh,920px);max-height:none;background:#e9ecdf}
/* Today wallpaper */
.todayhero{position:relative;overflow:hidden;border-radius:22px;margin:0 0 22px;isolation:isolate;border:1px solid var(--line);
  --sky1:#CFE3EC;--sky2:#EDF3E2;--sun:#F6D57A;--glow:rgb(246 213 122 / .45);--h1:#CFDDB4;--h2:#AFC78A;--h3:#86A85E;--h4:#5E8240;--tree:#3F5F2A;--tree2:#6E8F4A;--cloud:#FFFFFF;--hink:var(--ink);--hmuted:var(--muted)}
.todayhero[data-tod="morning"]{--sky1:#F7E3C4;--sky2:#EAF1DC;--sun:#F2B65A;--glow:rgb(242 182 90 / .45)}
.todayhero[data-tod="evening"]{--sky1:#E9B98F;--sky2:#F3DCC4;--sun:#E38B4F;--glow:rgb(227 139 79 / .5);--h1:#C9C79E;--h2:#9FB07A;--h3:#738F52;--h4:#4F6B37;--tree:#344A25;--tree2:#5A7240;--cloud:#FBE6D6}
.todayhero[data-tod="night"]{--sky1:#1C2633;--sky2:#34443A;--sun:#F1EBD0;--glow:rgb(241 235 208 / .22);--h1:#3A4B3A;--h2:#2E3E2C;--h3:#243322;--h4:#1B2719;--tree:#121B10;--tree2:#1E2B1A;--hink:#EEF2E6;--hmuted:#C3CCB6}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .todayhero{--sky1:#22323A;--sky2:#1E2A1C;--sun:#D9C27A;--glow:rgb(217 194 122 / .22);--h1:#2C3B24;--h2:#26341F;--h3:#1F2B19;--h4:#182214;--tree:#10180D;--tree2:#1B2616;--cloud:#3A4A44;--hink:var(--ink);--hmuted:var(--muted)}
  :root:not([data-theme="light"]) .todayhero[data-tod="morning"]{--sky1:#3A3426;--sky2:#20291C;--sun:#D9A85A}
  :root:not([data-theme="light"]) .todayhero[data-tod="evening"]{--sky1:#42281E;--sky2:#24261B;--sun:#D98250;--glow:rgb(217 130 80 / .3)}
  :root:not([data-theme="light"]) .todayhero[data-tod="night"]{--sky1:#121A24;--sky2:#1D2820}
}
:root[data-theme="dark"] .todayhero{--sky1:#22323A;--sky2:#1E2A1C;--sun:#D9C27A;--glow:rgb(217 194 122 / .22);--h1:#2C3B24;--h2:#26341F;--h3:#1F2B19;--h4:#182214;--tree:#10180D;--tree2:#1B2616;--cloud:#3A4A44;--hink:var(--ink);--hmuted:var(--muted)}
:root[data-theme="dark"] .todayhero[data-tod="morning"]{--sky1:#3A3426;--sky2:#20291C;--sun:#D9A85A}
:root[data-theme="dark"] .todayhero[data-tod="evening"]{--sky1:#42281E;--sky2:#24261B;--sun:#D98250;--glow:rgb(217 130 80 / .3)}
:root[data-theme="dark"] .todayhero[data-tod="night"]{--sky1:#121A24;--sky2:#1D2820}
.heroart{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.heroart .hs1{stop-color:var(--sky1)} .heroart .hs2{stop-color:var(--sky2)}
.heroart .hg1{stop-color:var(--glow)} .heroart .hg2{stop-color:var(--glow);stop-opacity:0}
.heroart .hsun{fill:var(--sun)} .heroart .hmooncut{fill:var(--sky1)}
.heroart .hh1{fill:var(--h1)} .heroart .hh2{fill:var(--h2)} .heroart .hh3{fill:var(--h3)} .heroart .hh4{fill:var(--h4)}
.heroart .htree{fill:var(--tree)} .heroart .htree2{fill:var(--tree2)}
.heroart .hclouds{fill:var(--cloud);opacity:.7;animation:hdrift 90s linear infinite alternate}
.heroart .hbirds{fill:none;stroke:var(--tree);stroke-width:2;stroke-linecap:round;opacity:.55;animation:hfly 40s linear infinite}
.heroart .hstar{fill:#F6F1DA;animation:htwinkle 4s ease-in-out infinite}
@keyframes hdrift{to{transform:translateX(-140px)}}
@keyframes hfly{from{transform:translateX(-30px)}to{transform:translateX(160px)}}
@keyframes htwinkle{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .heroart *{animation:none!important} }
.herobody{position:relative;padding:28px 30px 150px;color:var(--hink)}
.herobody .pagehead{margin-bottom:16px}
.herobody .eyebrow{color:var(--hink);opacity:.8}
.herobody .lede{color:var(--hmuted)}
.herobody .pill{background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@media (max-width:600px){ .herobody{padding:22px 18px 120px} .todayhero{border-radius:18px} }
.l1help{margin:-6px 0 18px;border:1px solid var(--line);border-left:4px solid var(--slate);background:var(--surface);border-radius:12px;padding:10px 14px}
.l1help summary{cursor:pointer;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
.l1help p{margin:8px 0 2px;max-width:65ch}
.l1flag{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 5px;border-radius:5px;background:var(--slate);color:var(--surface);font:700 .68rem/1 var(--sans);letter-spacing:.06em;margin-right:6px}
.l1word{margin:10px 0 4px;display:grid;gap:8px;justify-items:start}
.l1ff{margin:0;padding:10px 12px;border-radius:10px;background:var(--err-soft);font-size:.92rem}
.l1ff .tag{background:var(--err);color:var(--surface);margin-right:6px}
.l1tr{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--slate-soft)}
.l1tr p{margin:0 0 4px}
.l1tip{color:var(--muted);font-size:.84rem;margin-top:6px!important}
.artrules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.artcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:grid;gap:6px;align-content:start}
.artcard.focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.artcard h3{margin:0;font-family:var(--serif);font-weight:500;font-size:1.15rem}
.artcard p{margin:0}
.artex{margin:2px 0;padding-left:18px;color:var(--ink)}
.artex li{font-style:italic}
.artnote{font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px!important}
.artgap{display:inline-block;min-width:2.6ch;padding:0 6px;border-bottom:3px solid var(--slate);text-align:center}
.artgap.ok{border-color:var(--ok);color:var(--ok)}
.artgap.no{border-color:var(--err);color:var(--err)}
.artwrong{text-decoration:underline wavy var(--err);text-decoration-thickness:1px;text-underline-offset:6px}
.oldtag{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;background:var(--slate-soft);color:var(--ink);font-size:.82rem;font-weight:600}
.sndcats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
@media (max-width:600px){ .sndcats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-left:-4px;margin-right:-4px;scrollbar-width:thin} .sndcats .chipbtn{flex:none} }
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-accent)}
.sndword{font-family:var(--serif);font-size:1.5rem!important;text-align:center;justify-content:center}
.sndtip{margin:16px 0 6px;font-size:.92rem}
.sylrow{display:flex;flex-wrap:wrap;gap:8px}
.sylbtn{min-width:64px;justify-content:center;font-family:var(--serif);font-size:1.3rem!important}
.stressword{font-family:var(--serif);font-size:1.15rem;letter-spacing:.02em}
.stressword b{color:var(--sage)}
.weakrow{display:flex;flex-wrap:wrap;gap:6px}
.weaktok{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-family:var(--serif);font-size:1.2rem;min-height:44px}
.weaktok.on{background:var(--slate-soft);border-color:var(--slate)}
.weaktok.good{background:var(--ok-soft);border-color:var(--ok);text-decoration:underline}
.weaktok.miss{border:2px dashed var(--err);text-decoration:underline}
.weaktok.bad{background:var(--err-soft);border-color:var(--err)}
.weaktok.optw{color:var(--muted);border-style:dotted}
.setnote{margin:-6px 0 16px;color:var(--muted);font-size:.92rem}
.setbanner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:12px 16px;border:1px solid var(--slate);background:var(--slate-soft);border-radius:14px}
.archset{margin:0 0 12px}
.archset summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
.archset summary::-webkit-details-marker{display:none}
.archset summary small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.archname{font-family:var(--serif);font-weight:500;font-size:1.25rem}
.archbody{margin-top:12px;display:grid;gap:10px}
.archlv{display:grid;grid-template-columns:42px minmax(0,1fr);gap:4px 10px;padding-top:10px;border-top:1px solid var(--line);font-size:.92rem}
.archlv b{grid-row:span 2}
.archlv .tag{font-style:normal;margin-right:6px}
.archempty p{color:var(--muted);margin:6px 0 14px;max-width:62ch}
.gamepicks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 10px}
.gamepick{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px}
.gamepick b{font-weight:600}
.gamepick small{color:var(--muted);font-size:.84rem}
.gamepick[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.gameblurb{margin:0 0 12px;color:var(--muted);max-width:62ch}
.gamewrap:fullscreen{border-radius:0;max-height:none;aspect-ratio:auto}
.gamewrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.gamewrap .gmsg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#d8d2c8}
.gamebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.gamebar .grow{flex:1}
.breakpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.breaknote{margin:12px 0 0;border:1px solid var(--sage);background:var(--sage-soft);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:560px){ #gFull{display:none!important} .gamebar .btn{min-height:40px;padding:8px 12px} .gamebar .breakpill{padding:5px 12px} }
@media (max-width:860px){ .gamewrap{aspect-ratio:auto;height:calc(100dvh - 300px);min-height:420px;max-height:none} .gamewrap.tall{height:calc(100dvh - 190px);min-height:560px} }

@media (max-width:860px){
  .shell{display:block}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  .topbar .dispbtn{padding:8px 10px}
  main{padding-block:22px calc(100px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:.64rem;font-weight:600;padding:4px 0;min-height:54px;min-width:0}
  .tbtn .ic{display:grid;place-items:center;width:min(56px,100%);height:30px;border-radius:999px}
  .tbtn[aria-current="page"]{color:var(--ink)}
  .tbtn[aria-current="page"] .ic{background:var(--sage-soft);color:var(--sage)}
}

/* Page furniture */
.pagehead{margin:0 0 22px}
.pagehead.tight{margin-bottom:16px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.75rem,4.2vw,2.4rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{margin:0 0 4px;font-size:.8rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sage)}
h2.sec{font-size:.8rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px}
h2.mini{font-size:.82rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h2.h3,h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-weight:500;padding:8px 10px 8px 0;margin:-8px 0 6px;min-height:44px}

.back:hover{color:var(--ink)}
.counter{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}

.tag.soft{background:var(--sage-soft);color:var(--ink)}
.dim{color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--sage);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.linkbtn:hover{color:var(--ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--sage);border-radius:12px;padding:10px 18px;min-height:46px;background:var(--sage);color:var(--on-accent);font-weight:600}

.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.sage{background:var(--sage);color:var(--on-accent)}
.btn.danger{background:var(--err);border-color:var(--err);color:var(--surface)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:40px;font-size:.9rem;font-weight:500}
.iconbtn .ico{width:18px;height:18px;color:var(--sage)}
.iconbtn:hover{background:var(--sunk)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Today */
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--muted)}
.pill b{color:var(--ink);font-family:var(--serif);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.newbanner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;background:var(--sage-soft);border-radius:18px;padding:20px 22px;margin:0 0 18px}
.newbanner>div{min-width:0;flex:1 1 260px}
.newbanner h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:8px 0 4px}
.newbanner p:not(.tag){margin:0;color:var(--muted);font-size:.93rem}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.step h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 2px}
.step p{margin:0;color:var(--muted);font-size:.93rem}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);font-weight:600}
.step.done{box-shadow:none;background:transparent}
.step.done .num{background:var(--sage);color:var(--on-accent)}
.step.done h2{color:var(--muted)}
@media (max-width:560px){ .step{grid-template-columns:38px minmax(0,1fr)} .step .btn{grid-column:1/-1} }

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cards.three{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;color:var(--ink);min-width:0;transition:border-color .2s, transform .2s}
.card:hover{border-color:var(--sage);transform:translateY(-1px)}
.card h3{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.meta2{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted)}
.labcard{background:var(--sage-soft);border-color:transparent}
.hero-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;width:100%;text-align:left;border:0;background:var(--sage);color:var(--on-accent);border-radius:20px;padding:22px 24px}
.hero-card>span:first-child{flex:1 1 280px;min-width:0}
.hero-card h2{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:8px 0 4px}
.hero-card p{margin:0;opacity:.9;max-width:52ch}
.hero-card .tag{background:var(--on-accent);color:var(--sage)}
.hero-card .btn{background:var(--on-accent);color:var(--sage);border-color:var(--on-accent);pointer-events:none}
.hero-card:hover{filter:brightness(1.06)}

/* Word cards */
.cards.words{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ww{font-family:var(--serif);font-size:1.4rem;line-height:1.2}
.wdef{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wstats,.wordmeters{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:auto;padding-top:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wstats>span,.wordmeters>span{display:flex;flex-direction:column;gap:3px}
.wstats small,.wordmeters small{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.wstats b,.wordmeters b{color:var(--ink);font-size:.98rem}
.wordmeters{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);gap:10px 28px}
.seg{display:inline-flex;gap:3px;align-items:center;min-height:1.2em}
.seg i{width:14px;height:6px;border-radius:3px;background:var(--sunk)}
.seg i.on{background:var(--sage)}
.learn .field h2{margin:0 0 6px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.learn .def{margin:16px 0 4px}
.learn .grid2{margin-top:20px}
.learn .example{margin-top:14px}

/* Rounds */
.qkind{font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage);margin:0 0 8px}
.gap{color:var(--sage);font-weight:600;letter-spacing:.05em}
.opt{display:flex;align-items:center;gap:12px;min-height:50px}
.opt kbd{font:600 .8rem var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:inline-grid;place-items:center}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt.right kbd,.opt.wrong kbd{border-color:currentColor}
.inrow .tin{font-size:1.05rem;padding:10px 14px;max-width:340px;min-height:46px}
.hintline{margin:12px 0 0;font-size:.92rem;color:var(--muted)}
.feedback{border-radius:12px}
.endpanel .score{font-family:var(--serif);font-size:3.4rem;color:var(--sage);margin:0;line-height:1.1;font-variant-numeric:tabular-nums}
.endpanel .score span{font-size:1.6rem;color:var(--muted)}
.endpanel .lede{margin-top:8px}

/* Flashcards */
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow);margin-top:6px}
.fword{font-family:var(--serif);font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.1;margin:4px 0 8px}
.fdef{font-family:var(--serif);font-size:1.3rem;line-height:1.5;margin:0 0 8px;max-width:48ch}
.fback{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}

/* Ordering */
.slothint{color:var(--muted);font-size:.92rem;padding:0 6px}
.chip{min-height:42px;font-size:1rem}
.steps{flex-wrap:wrap}
.steps button{width:38px;height:38px}

/* Use it */
.usagehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.usagehead h2{margin:0}
.usage .bar{margin:10px 0 14px}
.usechips{display:flex;flex-wrap:wrap;gap:6px}
.uchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 6px 5px 14px;min-height:40px}
.uchip span{font-family:var(--serif)}
.uchip b{min-width:28px;height:28px;border-radius:999px;display:inline-grid;place-items:center;background:var(--sunk);font-size:.82rem;font-variant-numeric:tabular-nums}
.uchip.full b{background:var(--sage);color:var(--on-accent)}
.uchip:hover{border-color:var(--sage)}
.usew{color:var(--muted)} .usew b{color:var(--sage);font-family:var(--serif);font-size:1.1rem}
.plainline{background:var(--paper);border-radius:12px;padding:12px 16px}
.partners{margin:0 0 14px;font-size:.93rem}
.partners summary{cursor:pointer;color:var(--sage);font-weight:500;min-height:32px}
.partners ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.prompt{background:var(--paper);border-radius:14px;padding:16px;margin:4px 0 14px}
.prompt .hintline{margin-top:6px}
textarea.tall{min-height:180px}
.storyws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.sw{font-family:var(--serif);font-size:1.15rem;border:2px dashed var(--line);border-radius:10px;padding:4px 14px}
.sw.on{border-style:solid;border-color:var(--sage);background:var(--sage-soft)}
.sw.on::before{content:"✓ ";color:var(--sage)}
.timer.big{height:12px;margin:18px 0 6px}
.clock{font-family:var(--serif);font-size:2rem;margin:0;font-variant-numeric:tabular-nums}
.ctl .picks{gap:6px}
.pick{min-height:38px}
.confirm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.93rem}
.wl{font-family:var(--serif);font-size:1.05rem;color:var(--ink);text-decoration-color:var(--line)}

/* Display settings sheet */
.seg3{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border-radius:12px;padding:4px;margin:0 0 18px}
.seg3 button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:8px 12px;min-height:40px;font-weight:500;color:var(--muted)}
.seg3 button[aria-checked="true"]{background:var(--sage);color:var(--on-accent)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheethead h2{margin:0}

/* Learn */
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.headword{font-family:var(--serif);font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;font-weight:400;letter-spacing:-.01em;margin:0}
.syl{display:inline-flex;align-items:baseline;flex-wrap:wrap}
.syl span{color:var(--muted)}
.syl span.stress{color:var(--ink);font-weight:600}
.syl b{color:var(--line);font-weight:400;margin:0 .06em}
.meta{color:var(--muted);font-size:.95rem}
.def{font-family:var(--serif);font-size:1.25rem;line-height:1.5;margin:18px 0;max-width:52ch}
.def.hidden{color:transparent;background:var(--sunk);border-radius:8px;user-select:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:10px}
.field h4{margin:0 0 6px;font-size:.9rem;font-weight:600;color:var(--muted)}
.field p,.field ul{margin:0}
.field ul{padding-left:18px}
.example{border-left:3px solid var(--sage);padding:4px 0 4px 14px;font-family:var(--serif);font-style:italic;margin:20px 0 0}
.watch{margin-top:20px;background:var(--slate-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}


/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--sage);transition:width .3s}
.qkind{font-size:.88rem;color:var(--slate);margin:0 0 6px}
.qtext{font-family:var(--serif);font-size:1.3rem;line-height:1.45;margin:0 0 20px;max-width:56ch}
.opts{display:grid;gap:8px;max-width:560px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--sage)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--err-soft);border-color:var(--err)}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;padding:12px 14px;border-radius:10px;font-size:.95rem;max-width:560px}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--err-soft)}
.score{font-family:var(--serif);font-size:3rem;margin:0}

/* Typed items */
.item{display:grid;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .s{font-family:var(--serif);font-size:1.08rem}
.item .hintline{font-size:.88rem;color:var(--muted)}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tin{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;min-width:0;flex:1 1 180px;max-width:280px}
.tin.right{border-color:var(--ok);background:var(--ok-soft)}
.tin.wrong{border-color:var(--err);background:var(--err-soft)}
.mark{font-size:.9rem}
.mark.ok{color:var(--ok)} .mark.no{color:var(--err)}
.tense{display:inline-block;font-size:.8rem;border-radius:6px;padding:1px 8px;background:var(--slate-soft);color:var(--ink);margin-right:6px}

/* Unscramble */
.slot{min-height:54px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper)}
.slot.right{border:1px solid var(--ok);background:var(--ok-soft)}
.slot.wrong{border:1px solid var(--err);background:var(--err-soft)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.chip:hover{border-color:var(--sage)}
.chip.target{border-color:var(--sage);background:var(--sage-soft)}
.punct{font-family:var(--serif);font-size:1.2rem;color:var(--muted);padding:0 4px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:.88rem}
.steps button.done{background:var(--ok-soft);border-color:var(--ok)}
.steps button[aria-current="true"]{border-color:var(--ink);border-width:2px}

textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;resize:vertical;line-height:1.5}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:.95rem}
.checks li::before{content:"○";display:inline-block;width:1.4em;color:var(--muted)}
.checks li.pass::before{content:"✓";color:var(--ok)}
.checks li.fail::before{content:"✕";color:var(--err)}
.checks li.warn::before{content:"!";color:var(--err);font-weight:600}
.ai{margin-top:14px;padding:14px;border-radius:10px;background:var(--slate-soft);font-size:.95rem;white-space:pre-wrap}
.model{margin-top:12px;font-family:var(--serif);font-style:italic;color:var(--muted)}

/* Progress */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:460px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.88rem}
td.w{font-family:var(--serif);font-size:1.05rem}
.meter{width:120px;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.meter i{display:block;height:100%;background:var(--sage)}

/* ---------- Moss mode (Tense lab) ---------- */
:root{--moss-wash:#B9C98F;--plain-wash:#E7EBE7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--moss-wash:#26331A;--plain-wash:#1D2221}}
:root[data-theme="dark"]{--moss-wash:#26331A;--plain-wash:#1D2221}
body.moss{
  --paper:#C3D19B; --surface:#E4EBCB; --sunk:#B2C385; --ink:#1F2C16; --muted:#4A5B37;
  --sage:#4E6B26; --sage-soft:#D0DCA9; --slate:#5E7A2E; --slate-soft:#D4DFB0;
  --ok:#2F6B2C; --ok-soft:#CFE3BC; --err:#9B4E33; --err-soft:#F0D7C8; --line:#9FB271;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body.moss{
    --paper:#1E2915; --surface:#28361D; --sunk:#334426; --ink:#E4EDCF; --muted:#A9BA8C;
    --sage:#9FC062; --sage-soft:#3A4D27; --slate:#B7CC7E; --slate-soft:#354726;
    --ok:#A2D28C; --ok-soft:#2F4626; --err:#E8A68A; --err-soft:#4C3022; --line:#45583A;
  }
}
:root[data-theme="dark"] body.moss{
  --paper:#1E2915; --surface:#28361D; --sunk:#334426; --ink:#E4EDCF; --muted:#A9BA8C;
  --sage:#9FC062; --sage-soft:#3A4D27; --slate:#B7CC7E; --slate-soft:#354726;
  --ok:#A2D28C; --ok-soft:#2F4626; --err:#E8A68A; --err-soft:#4C3022; --line:#45583A;
}
body,aside,.panel,.tab,.btn,.opt,.wordbtn,.chip,.pick,.room,.tcell,.tin,textarea{transition:background-color .5s ease,border-color .5s ease,color .5s ease}
.ripple{position:fixed;inset:0;z-index:50;pointer-events:none;clip-path:circle(0 at var(--x) var(--y));animation:wash .6s cubic-bezier(.6,0,.3,1) forwards}
.ripple.in{background:var(--moss-wash)} .ripple.out{background:var(--plain-wash)}
.ripple.fade{animation:fadeout .45s ease forwards;clip-path:circle(150% at var(--x) var(--y))}
@keyframes wash{to{clip-path:circle(150% at var(--x) var(--y))}}
@keyframes fadeout{to{opacity:0}}
.moss-only{display:none} body.moss .moss-only{display:block} body.moss .plain-only{display:none}
.tab.lab{color:var(--sage);border-color:var(--sage)}
.tab.lab::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:0 100% 0 100%;background:currentColor;vertical-align:1px}
.tab.lab[aria-selected="true"]{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.labopen{margin-top:16px;width:100%;text-align:left;border:1px solid var(--sage);background:var(--sage-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.labopen b{display:block;font-family:var(--serif);font-weight:500;font-size:1.05rem}
.labopen span{font-size:.85rem;color:var(--muted)}
.labopen:hover{border-width:2px;padding:11px 13px}

/* Lab layout */
.labhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;margin-bottom:6px}
.eyebrow{margin:0 0 2px;font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sage)}
.xp{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px}
.lvl{background:var(--sage);color:var(--surface);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.xpbar{width:110px;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sage);transition:width .4s}
.xpn{font-size:.85rem;color:var(--muted);white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:0 0 22px}
.room{text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px}
.room b{display:block;font-weight:600;font-size:.98rem}
.room span{font-size:.84rem;color:var(--muted)}
.room:hover{border-color:var(--sage)}
.room[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.room[aria-selected="true"] span{color:inherit;opacity:.75}

/* Tense map */
.tscroll{overflow-x:auto;margin:0 -4px;padding:4px}
.tgrid{display:grid;grid-template-columns:76px repeat(4,minmax(120px,1fr));gap:6px;min-width:600px}
.tgrid .hd{font-size:.82rem;font-weight:600;color:var(--muted);padding:4px 6px;align-self:end}
.tgrid .rh{font-family:var(--serif);font-size:1.02rem;align-self:center;padding-left:4px}
.tcell{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;min-height:74px;position:relative}
.tcell:hover{border-color:var(--sage)}
.tcell b{display:block;font-size:.88rem;font-weight:600;margin-bottom:3px}
.tcell span{font-size:.8rem;color:var(--muted);font-family:var(--serif);font-style:italic;line-height:1.35;display:block}
.tcell.seen::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:0 100% 0 100%;background:var(--sage)}
.tcell[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);border-width:2px;padding:9px}
.tl{width:100%;max-width:420px;height:auto;display:block;margin:6px 0 4px}
.tl .axis{stroke:var(--muted);stroke-width:1.5}
.tl .now{stroke:var(--muted);stroke-dasharray:3 3}
.tl .act{stroke:var(--sage);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tl .dot{fill:var(--sage)}
.tl .ref{stroke:var(--ink);stroke-width:2}
.tl text{fill:var(--muted);font:11px var(--sans)}
.tl text.r{fill:var(--ink);font-weight:600}
.sig{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.sig span{background:var(--sunk);border-radius:6px;padding:2px 9px;font-size:.86rem}
.formrow{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.formrow:last-child{border-bottom:0}
.formrow .sign{flex:0 0 22px;font-weight:600;color:var(--muted);text-align:center}
.formrow .sentence{font-size:1.15rem;flex:1}

/* Coloured sentence parts */
.sentence{font-family:var(--serif);font-size:clamp(1.4rem,4vw,2rem);line-height:1.5}
.sentence span{border-radius:6px}
.sentence .p-aux,.sentence .p-auxneg,.sentence .p-neg{padding:0 4px}
.p-subj{color:var(--slate);font-weight:500}
.p-aux{background:var(--sage-soft)}
.p-neg,.p-auxneg{background:var(--err-soft);color:var(--err)}
.p-main{font-weight:600;text-decoration:underline;text-decoration-color:var(--sage);text-decoration-thickness:3px;text-underline-offset:5px}
.p-obj{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;color:var(--muted);margin-top:10px}
.legend span{font-family:var(--serif);font-size:.95rem;border-radius:5px;padding:0 5px}

/* Sentence machine */
.ctl{margin-bottom:14px}
.ctl h4{margin:0 0 6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.92rem}
.pick:hover{border-color:var(--sage)}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stage{background:var(--paper);border-radius:14px;padding:20px;margin-top:6px}
.stage .tname{font-size:.9rem;font-weight:600;color:var(--sage);margin:0 0 4px}
.rolling .sentence{opacity:.55}
.callout{margin-top:14px;background:var(--slate-soft);border-radius:10px;padding:10px 14px;font-size:.93rem}
.counter{font-size:.88rem;color:var(--muted)}

/* Games */
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.streak{font-weight:600;color:var(--sage)}
.gamebig{font-family:var(--serif);font-size:clamp(1.3rem,3.6vw,1.75rem);line-height:1.5;margin:6px 0 18px}
.blank{display:inline-block;min-width:4.6em;border-bottom:3px dashed var(--sage);text-align:center;color:var(--sage);font-weight:600}
.blank.filled{border-bottom-style:solid}
.bigopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;max-width:620px}
.bigopts .opt{font-family:var(--serif);font-size:1.25rem;text-align:center;padding:14px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tok{font-family:var(--serif);font-size:1.3rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 12px}
.tok:hover:not(:disabled){border-color:var(--err)}
.tok.right{background:var(--ok-soft);border-color:var(--ok)}
.tok.wrong{background:var(--err-soft);border-color:var(--err)}
.tok:disabled{cursor:default}
.fixed{font-family:var(--serif);font-size:1.15rem;margin-top:8px}
.fixed mark{background:var(--ok-soft);color:var(--ok);border-radius:5px;padding:0 4px;font-weight:600}
.timer{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--sage);transition:width 1s linear}
.timer.low i{background:var(--err)}
.flash-ok{animation:okpulse .4s}
.flash-no{animation:shake .35s}
@keyframes okpulse{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.trip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 16px}
.trip .arrow{color:var(--muted)}
.trip b{background:var(--sage);color:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.92rem}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--serif);font-size:1.25rem}
.fillrow .tin{font-family:var(--sans);font-size:1rem;max-width:340px;flex:1 1 220px}
.endcard{text-align:center;padding:10px 0}
.endcard .score{color:var(--sage)}

/* Falling leaves */
.leaf{position:fixed;width:12px;height:12px;border-radius:0 100% 0 100%;background:var(--sage);z-index:60;pointer-events:none;animation:leaf .9s ease-out forwards}
@keyframes leaf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.leaf,.ripple{display:none}}

/* Nickname + progress code */
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.gatecard{background:var(--surface);border-radius:18px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgb(0 0 0 / .25)}
.gatecard h2{margin:0 0 6px}
.gatecard p{margin:0 0 16px;color:var(--muted)}
.gatecard .tin{max-width:none;width:100%;font-size:1.05rem;padding:11px 14px}
.gatecard .err{color:var(--err);font-size:.9rem;margin:8px 0 0}
.whoami{margin:18px 0 0;font-size:.88rem;color:var(--muted)}
.whoami b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 18px}
.stat{background:var(--paper);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.85rem;color:var(--muted)}
.weeks{display:flex;align-items:flex-end;gap:8px;height:90px;margin:4px 0 4px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);height:100%;justify-content:flex-end}
.weeks i{display:block;width:100%;max-width:40px;background:var(--sage);border-radius:5px 5px 2px 2px;min-height:3px}
.codebox{width:100%;min-height:72px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all}

/* Level switch */
.levels{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 18px}
.lvlabel{font-size:.85rem;font-weight:600;color:var(--muted)}
.lvbtns{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.lvb{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:.92rem;color:var(--muted)}
.lvb:hover{color:var(--ink)}
.lvb[aria-checked="true"]{background:var(--sage);color:var(--surface)}
.lvdesc{font-size:.9rem;color:var(--muted);flex:1 1 240px}
.tcell.locked{opacity:.5}
.tcell .from{position:absolute;bottom:7px;right:9px;font-size:.72rem;font-style:normal;font-weight:600;color:var(--muted);font-family:var(--sans)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.pick small{font-size:.72rem;font-weight:600}
.locknote{margin:0 0 10px;background:var(--sunk);border-radius:8px;padding:6px 12px;font-size:.9rem;display:inline-block}



/* Irregular verbs */
.vmodes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.bigverb{font-family:var(--serif);font-size:clamp(2.1rem,7vw,3.2rem);line-height:1.15;margin:2px 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;overflow-wrap:anywhere}
.vbig .opt{justify-content:center}
.vtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.vtools .tin{flex:1 1 200px;max-width:320px;min-height:40px}
.vgroup{margin-top:20px}
.vgroup h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:1.12rem;margin:0 0 8px}
.vgroup h3 span{font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.vgroup h3 em{font-style:normal;font-family:var(--sans);font-size:.75rem;font-weight:600;background:var(--sage-soft);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.vtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 34px;gap:2px 8px;align-items:center;background:var(--paper);border-radius:10px;padding:6px 6px 6px 12px}
.vrow .f{font-family:var(--serif);font-size:1.02rem;border:0;background:transparent;text-align:left;padding:3px 5px;border-radius:6px;min-width:0;overflow-wrap:anywhere;color:var(--ink);cursor:default}
.vrow .f.b{font-weight:600;padding-left:0}
.vrow .f small{font-family:var(--sans);font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage)}
.vrow .f.hid{background:var(--sunk);color:transparent;cursor:pointer;user-select:none}
.vrow.mastered .f.b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:0 100% 0 100%;background:var(--sage);vertical-align:2px}
.say{border:0;background:transparent;color:var(--muted);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;flex:none}
.say .ico{width:20px;height:20px}
.say:hover{background:var(--sunk);color:var(--ink)}
.vnote{grid-column:1/-1;font-size:.82rem;color:var(--muted);line-height:1.4;padding:0 0 2px}
.forms3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;max-width:560px}
.forms3 label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.forms3 .tin{max-width:none;font-size:1.15rem;font-family:var(--serif);min-height:46px;color:var(--ink)}
.passage{display:flex;flex-wrap:wrap;gap:6px 1px;margin:6px 0 4px;max-width:760px}
.ptok{font-family:var(--serif);font-size:1.25rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 4px;color:var(--ink);min-height:40px}
.ptok:hover:not(:disabled){border-color:var(--line);background:var(--paper)}
.ptok.on{background:var(--sage-soft);border-color:var(--sage)}
.ptok.right{background:var(--ok-soft);border-color:var(--ok)}
.ptok.wrong{background:var(--err-soft);border-color:var(--err)}
.ptok.strike{text-decoration:line-through}
.ptok.missed{border:2px dashed var(--ok);padding:1px 3px}
.ptok:disabled{cursor:default}
.hintverb{color:var(--muted);font-size:.85em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-width:760px}
.mc{font-family:var(--serif);font-size:1.15rem;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 8px;min-height:60px;color:var(--ink);overflow-wrap:anywhere}
.mc.form{font-style:italic}
.mc:hover:not(:disabled){border-color:var(--sage)}
.mc.sel{border:2px solid var(--sage);background:var(--sage-soft);padding:13px 7px}
.mc.done{background:var(--ok-soft);border-color:var(--ok);opacity:.5;cursor:default}
.mc.bad{animation:shake .35s;border-color:var(--err);background:var(--err-soft)}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.endcard .pairs{justify-content:center}
.pairs span{background:var(--paper);border-radius:8px;padding:3px 10px;font-family:var(--serif);font-size:.98rem}

/* Vocabulary levels */
.regsec{margin-top:26px}
.regh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 12px;font-size:.93rem;font-weight:400;color:var(--muted)}
.tag.reg-f{background:var(--slate);color:var(--on-accent)}
.tag.reg-i{background:var(--sage);color:var(--on-accent)}
.wtags{display:flex;gap:6px;margin:0 0 6px}
.regh .tag{font-size:.78rem;padding:3px 11px}
.card:disabled{opacity:.55;cursor:default;transform:none;border-color:var(--line)}
.pill .linkbtn{min-height:0;padding:0;font-size:.9rem}

/* Video of the week */
.watchcard{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:20px;background:var(--ink);color:var(--paper);text-decoration:none}
.watchcard:hover{filter:brightness(1.12)}
.vplayer{margin:0}
.ytframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
.vplayer video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:18px}
.vplayer figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.vplayer figcaption a,.vcredit a{color:inherit}
.vcredit{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.watchcard .play{flex:none;width:58px;height:58px;border-radius:50%;background:var(--sage);color:var(--on-accent);display:grid;place-items:center}
.watchcard .play svg{width:28px;height:28px;margin-left:3px}
.watchcard b{display:block;font-family:var(--serif);font-weight:500;font-size:1.35rem}
.watchcard small{display:block;font-size:.88rem;opacity:.8;margin-top:2px}
.vvocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px 24px;margin:0}
.vvocab dt{font-family:var(--serif);font-size:1.1rem;font-weight:600}
.vvocab dd{margin:0;color:var(--muted);font-size:.93rem}
.vqi,.vli{padding:16px 0;border-bottom:1px solid var(--line)}
.vqi:first-child,.vli:first-child{padding-top:0}
.vqi:last-of-type,.vli:last-child{border-bottom:0}
.vqi .opt{font-size:.98rem;min-height:44px}
.vtask .vprompt{margin:0 0 12px;max-width:66ch}
.vunder{font-family:var(--serif);font-size:1.12rem;line-height:1.7}
.vunder u{text-decoration-color:var(--sage);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600}
.vtask .usagehead h3{margin:0}
.vsend{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--sage-soft);border-color:transparent}
.vsend h3{margin:0 0 2px} .vsend p{margin:0;color:var(--muted)}
.vsend>div{flex:1 1 260px;min-width:0}

/* Overrides on the kept styles */
.panel .item:last-child{border-bottom:0}
.opt{background:var(--paper)}
.qtext{font-size:1.35rem}
.def.hidden{color:transparent}
.btn.sage{color:var(--on-accent)}
.lvl,.trip b,.tab.lab[aria-selected="true"]{color:var(--on-accent)}
.room[aria-selected="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-accent)}
.meter{width:90px}
td{vertical-align:middle}
.tok.missed{border:2px dashed var(--err);color:var(--err)}
mark.dmark{background:var(--sage-soft);color:inherit;border-bottom:3px solid var(--sage);border-radius:4px;padding:0 3px}
/* ---------- Conversations, reading, writing, exam ---------- */
.convlog{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:min(520px,86%);padding:10px 14px;border-radius:16px;line-height:1.45;font-size:1rem;border:1px solid var(--line)}
.bub b{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-weight:600}
.bub.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
.bub.you{align-self:flex-end;background:var(--sage-soft);border-bottom-right-radius:5px}
.bub.you.ok{border-color:var(--ok)}.bub.you.meh{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--surface))}.bub.you.no{border-color:var(--err);background:var(--err-soft)}
.bub small{display:block;margin-top:4px;font-size:.85rem;color:var(--muted)}
.bub .linkbtn{vertical-align:middle;padding:0 2px}
.convopts{display:grid;gap:8px;margin:10px 0 4px}
.convopt{text-align:left;justify-content:flex-start;white-space:normal;display:block;width:100%}
.convopt small{display:block;margin-top:4px;font-size:.85rem;color:var(--muted);font-weight:400}
.opt.meh{background:color-mix(in srgb,var(--sun) 16%,var(--surface));border-color:var(--sun)}
.readtext{font-family:var(--serif);font-size:1.08rem;line-height:1.7;max-width:68ch}
.readtext p{margin:0 0 14px;position:relative}.readtext p:last-child{margin-bottom:0}
.pnum{display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin-right:8px;border-radius:50%;background:var(--sunk);color:var(--muted);font:600 .75rem var(--sans);vertical-align:.15em}
.wplan,.wphr{margin:6px 0 0;padding-left:1.2em;display:grid;gap:6px;line-height:1.45}
.wphr{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.wphr li{padding:4px 10px;border-radius:999px;background:var(--sunk);font-size:.92rem}
.wmodel{margin-top:14px;padding:14px 16px;border-left:3px solid var(--sage);background:var(--sunk);border-radius:0 12px 12px 0;font-family:var(--serif);line-height:1.65}
.wmodel p{margin:0 0 10px}
.exgap3{min-width:5ch}
/* ---------- Psotek, the cheeky hedgehog ---------- */
.pso{display:block;width:100%;height:auto;overflow:visible}
.psobub{position:relative;margin:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 13px;font-weight:600;font-size:.95rem;line-height:1.35;box-shadow:var(--shadow);max-width:230px}
.psotoast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:flex-end;gap:4px;pointer-events:none;transform:translateY(150%);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.psotoast.on{transform:none}
.psotoast .pso{width:96px;flex:none}
.psotoast .psobub{border-radius:16px 16px 4px 16px;margin-bottom:58px}
.herpso{position:absolute;right:22px;bottom:6px;width:160px;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none}
.herpso .psobub{font-size:.88rem;margin-right:36px;border-radius:16px 16px 4px 16px}
.psoend{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.psoend .pso{width:112px;flex:none}
.endcard .psoend{justify-content:center}
.gatepso{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.gatepso .pso{width:84px;flex:none}
@media (max-width:860px){ .psotoast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} .psotoast .pso{width:76px} .psotoast .psobub{margin-bottom:44px;font-size:.88rem} }
@media (max-width:600px){ .herpso{width:112px;right:10px} .herpso .psobub{font-size:.8rem;margin-right:10px;max-width:170px} .psoend .pso{width:88px} }
@media (prefers-reduced-motion: reduce){ .psotoast{transition:none} }
/* ---------- Badges ---------- */
.medal{display:block;width:100%;height:auto}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:16px}
.bgcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:var(--shadow)}
.bgcard .medal{width:120px}
.bgcard h3{margin:6px 0 0;font-size:1.12rem}
.bgcard .bgen{margin:0;color:var(--muted);font-size:.9rem}
.bgcard .bgdesc{margin:6px 0 0;font-size:.88rem;color:var(--muted);min-height:2.4em}
.bgcard.locked .medal{opacity:.55;filter:grayscale(1)}
.bgtiers{display:flex;gap:6px;margin:8px 0 2px}
.bgtiers i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.bgtiers i.b{background:#B87A45;border-color:#8E5A2E}.bgtiers i.s{background:#AEB9C2;border-color:#7F8B95}.bgtiers i.g{background:#D9A441;border-color:#A97A22}
.bgbar{width:100%;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bgbar i{display:block;height:100%;background:var(--sage);border-radius:inherit}
.bgnext{font-size:.82rem;color:var(--muted);margin:4px 0 0;font-variant-numeric:tabular-nums}
.bgsum{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0}
.bgpop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 45%,transparent);animation:bgfade .25s ease}
.bgpopcard{position:relative;background:var(--surface);border-radius:22px;padding:26px 24px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgb(0 0 0 / .3);animation:bgpopin .5s cubic-bezier(.3,1.5,.5,1)}
.bgpopcard .eyebrow{margin:0}
.bgpopcard h2{margin:4px 0 0;font-size:1.6rem}
.bgpopcard .bgen{margin:0 0 6px;color:var(--muted)}
.bgpopcard .bigmedal{width:170px;margin:6px auto 4px;animation:bgspin 1s cubic-bezier(.3,1.3,.5,1)}
.bgpopcard .bgtierlbl{display:inline-block;margin:2px 0 8px;padding:3px 12px;border-radius:99px;font-weight:600;font-size:.88rem;color:#2B1D14}
.bgpopcard .bgpso{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:8px 0 4px}
.bgpopcard .bgpso .pso{width:86px;flex:none}
.bgpopcard .bgpso .psobub{margin-bottom:34px;font-size:.92rem}
.bgpopcard .row{justify-content:center;margin-top:10px}
.bgmini{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.bgmini figure{margin:0;width:96px}
.bgmini figcaption{font-size:.8rem;color:var(--muted);line-height:1.25}
.pill.bgpill{cursor:pointer}

function norm(s){

async function aiFeedback(word, sentence, tense, out, btn){
  if(!sample) return;
  btn.disabled=true; out.hidden=false; out.textContent="Thinking…";
  const prompt = `You are a friendly English teacher giving feedback to a learner (around B1–B2 level).
Target word: "${word}"${tense?`\nRequired tense: ${tense}`:""}
Learner's sentence: """${sentence}"""
Check: 1) is the target word (or a form of it) used with the correct meaning and grammar, 2) ${tense?"is the required tense used correctly, 3) ":""}any other grammar or spelling errors.
Reply ONLY with JSON, no markdown: {"verdict":"correct"|"almost"|"needs work","meaning":"one short sentence","${tense?"tense":"grammar"}":"one short sentence","corrected":"the corrected sentence (same as original if already correct)","tip":"one short, encouraging tip"}`;
  try{
    const r = await sample.json(prompt,{modelTier:"quick"});
    const verdict = {correct:"Correct",almost:"Almost there","needs work":"Needs some work"}[r.verdict]||r.verdict;
    out.textContent = `${verdict}\n\nMeaning: ${r.meaning||""}\n${tense?"Tense: "+(r.tense||""):"Grammar: "+(r.grammar||"")}\nBetter version: ${r.corrected||""}\nTip: ${r.tip||""}`;
    if(r.verdict==="correct") record(W[Object.keys(W).find(k=>W[k].word===word)].id,true);
  }catch(e){
    out.textContent = e && e.code==="not_granted" ? "Claude feedback wasn't allowed, so only the automatic checks are available."
      : e && e.code==="rate_limited" ? "Too many requests at once. Wait a minute and try again."
      : "Feedback couldn't load this time. The automatic checks above still work.";
    if(e && e.code==="not_granted"){ sample=null; document.querySelectorAll(".needs-ai").forEach(b=>b.hidden=true); }
  }finally{ btn.disabled=false; }
}

].map(([lv,s,why])=>{ const toks=s.split(" "); return {lv, why, toks:toks.map(t=>t.replace(/^[*~]/,"")), weak:toks.map((t,i)=>t.startsWith("*")?i:-1).filter(i=>i>=0), opt:toks.map((t,i)=>t.startsWith("~")?i:-1).filter(i=>i>=0)}; });

const snd = { mode:"hear", lv:null, cat:"all", q:null, done:false, right:0, seen:0, streak:0, sel:new Set(), queue:{} };
try{ const s=JSON.parse(localStorage.getItem("vocab5-sounds")||"null"); if(s){ snd.lv=s.lv; snd.cat=s.cat||"all"; snd.mode=s.mode||"hear"; } }catch(e){}
const saveSnd = () => { try{ localStorage.setItem("vocab5-sounds", JSON.stringify({lv:snd.lv,cat:snd.cat,mode:snd.mode})); }catch(e){} };
const sndLv = () => (snd.lv==null ? state.vlv : snd.lv);
let enVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); enVoice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function sayEn(text, rate=0.85){ try{ if(!canSpeak) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-GB"; if(enVoice) u.voice=enVoice; u.rate=rate; speechSynthesis.speak(u); }catch(e){} }
function sndNext(kind, list){ const L=sndLv(); let pool=list.filter(x=>x.lv<=L+1); if(pool.length<6) pool=list.slice();
  let q=snd.queue[kind]; const key=kind+L+snd.cat; if(!q||!q.length||q.key!==key){ q=shuffle(pool.slice()); q.key=key; snd.queue[kind]=q; } return q.pop(); }
function sndNote(c){ const lg=typeof helpLang==="function"?helpLang():""; if(lg==="pl") return `<span class="l1flag">PL</span>${esc(c.pl)}`; if(lg==="ro") return `<span class="l1flag">RO</span>${esc(c.ro)}`; return esc(c.en); }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBlocked = !SR, srBusy=false;

function viewSounds(){
  const L=sndLv();
  const modes=[["hear","Which word?"],["stress","Word stress"],["weak","Weak forms"],["say","Say it"]];
  $("#view").innerHTML=`
  <header class="pagehead"><p class="eyebrow">Pronunciation</p><h1>Sounds</h1>
    <p class="lede">Train your ear first, then your mouth. These are the sounds that Polish and Romanian speakers find hardest in English. Use headphones if you can.</p></header>
  <div class="levels"><span class="lvlabel">Level</span>
    <div class="lvbtns" role="radiogroup" aria-label="Pronunciation level">${LV.map((l,i)=>`<button class="lvb" type="button" role="radio" data-slv="${i}" aria-checked="${i===L}">${l}</button>`).join("")}</div></div>
  <div class="picks" style="margin:0 0 16px" role="tablist" aria-label="Pronunciation practice">${modes.map(([m,l])=>`<button class="pick" type="button" data-sm="${m}" aria-pressed="${snd.mode===m}">${l}</button>`).join("")}</div>
  ${canSpeak?"":`<div class="feedback no">Your browser can't play English speech. Try Chrome, Edge or Safari.</div>`}
  <div id="sroom"></div>`;
  $$("[data-slv]").forEach(b=>b.onclick=()=>{ snd.lv=+b.dataset.slv; snd.q=null; snd.done=false; saveSnd(); viewSounds(); });
  $$("[data-sm]").forEach(b=>b.onclick=()=>{ if(snd.mode===b.dataset.sm) return; snd.mode=b.dataset.sm; snd.q=null; snd.done=false; saveSnd(); viewSounds(); });
  ({hear:sndHear,stress:sndStress,weak:sndWeak,say:sndSay})[snd.mode]();
}
function sndHud(){ return `<div class="hud"><span>${snd.seen?`${snd.right} of ${snd.seen} right`:"Your score starts with the first answer"}</span><span class="streak">${snd.streak>=2?`Streak ${snd.streak}`:""}</span></div>`; }
function sndScore(ok,btn){ snd.seen++; track(ok); if(ok){ snd.right++; snd.streak++; if(btn) burst(btn,5); } else snd.streak=0; }
function sndCats(){ const L=sndLv(); return SND_CATS.filter(c=>c.lv<=L+1); }

function sndHear(){
  const cats=sndCats(); if(snd.cat!=="all" && !cats.some(c=>c.id===snd.cat)) snd.cat="all";
  if(!snd.q){ const pool=(snd.cat==="all"?cats:cats.filter(c=>c.id===snd.cat)).flatMap(c=>c.pairs.map(p=>({c,p})));
    const it=pool[rnd0(pool.length)]; const words=shuffle(it.p.slice()); snd.q={c:it.c, words, target:words[rnd0(words.length)]}; snd.done=false; snd.auto=true; }
  const q=snd.q;
  $("#sroom").innerHTML=`<div class="panel" id="sPanel">
    <div class="sndcats" role="group" aria-label="Sound groups"><button class="chipbtn" type="button" data-sc="all" aria-pressed="${snd.cat==="all"}">Mixed</button>${cats.map(c=>`<button class="chipbtn" type="button" data-sc="${c.id}" aria-pressed="${snd.cat===c.id}">${esc(c.t)}</button>`).join("")}</div>
    ${sndHud()}
    <p class="counter" style="margin:0">Listen. Which word do you hear?</p>
    <div class="row" style="margin:10px 0 14px"><button class="btn sage" type="button" id="sPlay">${ico("sound")} Play</button><button class="btn ghost" type="button" id="sSlow">Slower</button></div>
    <div class="bigopts">${q.words.map(w=>`<button class="opt sndword" type="button" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <div id="sFb"></div>
    <p class="sndtip"><b>${esc(q.c.t)}.</b> ${esc(q.c.tip)}</p>
    <p class="artnote" style="margin:0">${sndNote(q.c)}</p></div>`;
  $$("[data-sc]").forEach(b=>b.onclick=()=>{ snd.cat=b.dataset.sc; snd.q=null; saveSnd(); sndHear(); });
  $("#sPlay").onclick=()=>sayEn(q.target); $("#sSlow").onclick=()=>sayEn(q.target,0.6);
  if(snd.auto && snd.played){ setTimeout(()=>sayEn(q.target),150); } snd.auto=false;
  $$("#sPanel .sndword").forEach(b=>b.onclick=()=>{
    if(snd.done) return; snd.done=true; snd.played=true; const ok=b.dataset.w===q.target; sndScore(ok,b);
    $$("#sPanel .sndword").forEach(x=>{ x.disabled=true; if(x.dataset.w===q.target) x.classList.add("right"); }); if(!ok) b.classList.add("wrong");
    $("#sFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"Right, ":"Not quite. It was "}<b>${esc(q.target)}</b>. Listen to the difference.</div>
      <div class="row"><button class="btn ghost" type="button" id="sBoth">${ico("sound")} Hear ${esc(q.words.join(" · "))}</button><button class="btn" type="button" id="sNext">Next</button></div>`;
    $("#sBoth").onclick=()=>sayEn(q.words.join(". "),0.7);
    $("#sNext").onclick=()=>{ snd.q=null; sndHear(); }; $("#sNext").focus({preventScroll:true});
  });
}
function rnd0(n){ return Math.floor(Math.random()*n); }

function sndStress(){
  if(!snd.q){ snd.q=sndNext("stress",SND_STRESS); snd.done=false; }
  const q=snd.q, word=q.syl.join("");
  $("#sroom").innerHTML=`<div class="panel" id="sPanel">${sndHud()}
    <p class="counter" style="margin:0">Listen, then tap the syllable with the strongest beat.</p>
    <div class="row" style="margin:10px 0 14px"><button class="btn sage" type="button" id="sPlay">${ico("sound")} Hear “${esc(word)}”</button></div>
    <div class="sylrow">${q.syl.map((s,i)=>`<button class="opt sylbtn" type="button" data-i="${i}">${esc(s)}</button>`).join("")}</div>
    <div id="sFb"></div>
    <p class="artnote" style="margin-top:14px">${(()=>{ const lg=typeof helpLang==="function"?helpLang():""; return lg==="pl"?`<span class="l1flag">PL</span>Po polsku akcent pada prawie zawsze na przedostatnią sylabę. Po angielsku nie ma jednej zasady: comFORtable to błąd, poprawnie COMfortable.`:lg==="ro"?`<span class="l1flag">RO</span>Accentul în engleză nu urmează româna: comfortabil → COMfortable, nu comFORtable. Învață accentul odată cu cuvântul.`:"Polish stress almost always falls on the second-last syllable, so Polish speakers often say comFORtable or vegeTAble. Learn the stress with every new word."; })()}</p></div>`;
  $("#sPlay").onclick=()=>sayEn(word,0.75);
  $$("#sPanel .sylbtn").forEach(b=>b.onclick=()=>{
    if(snd.done) return; snd.done=true; const ok=+b.dataset.i===q.st; sndScore(ok,b);
    $$("#sPanel .sylbtn").forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.st) x.classList.add("right"); }); if(!ok) b.classList.add("wrong");
    const shown=q.syl.map((s,i)=>i===q.st?`<b>${esc(s.toUpperCase())}</b>`:esc(s)).join("·");
    $("#sFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"Right: ":"Not quite: "}<span class="stressword">${shown}</span></div>
      <div class="row"><button class="btn ghost" type="button" id="sAgain">${ico("sound")} Hear it again</button><button class="btn" type="button" id="sNext">Next word</button></div>`;
    $("#sAgain").onclick=()=>sayEn(word,0.75); $("#sNext").onclick=()=>{ snd.q=null; sndStress(); }; $("#sNext").focus({preventScroll:true});
  });
}

function sndWeak(){
  if(!snd.q){ snd.q=sndNext("weak",SND_WEAK); snd.done=false; snd.sel=new Set(); }
  const q=snd.q, text=q.toks.join(" ");
  $("#sroom").innerHTML=`<div class="panel" id="sPanel">${sndHud()}
    <p class="counter" style="margin:0">English shrinks small words like to, of, a and the. Listen, then tap every word that is said weakly.</p>
    <div class="row" style="margin:10px 0 14px"><button class="btn sage" type="button" id="sPlay">${ico("sound")} Natural speed</button><button class="btn ghost" type="button" id="sSlow">Slower</button></div>
    <div class="weakrow">${q.toks.map((t,i)=>`<button class="weaktok${snd.sel.has(i)?" on":""}" type="button" data-i="${i}" aria-pressed="${snd.sel.has(i)}">${esc(t)}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn" type="button" id="sChk">Check</button></div>
    <div id="sFb"></div>
    <p class="artnote" style="margin-top:14px">${(()=>{ const lg=typeof helpLang==="function"?helpLang():""; return lg==="pl"?`<span class="l1flag">PL</span>Po polsku każdą sylabę wymawiamy wyraźnie. Po angielsku małe słowa się „kurczą”, a mocne są tylko słowa z treścią. Bez tego angielski brzmi ciężko i za wolno.`:lg==="ro"?`<span class="l1flag">RO</span>În română fiecare silabă e pronunțată clar. În engleză cuvintele mici se „micșorează”, iar accentul cade pe cuvintele importante.`:"Polish and Romanian give every syllable equal weight. English squeezes the small words so the important ones stand out."; })()}</p></div>`;
  $("#sPlay").onclick=()=>sayEn(text,1); $("#sSlow").onclick=()=>sayEn(text,0.7);
  $$("#sPanel .weaktok").forEach(b=>b.onclick=()=>{ if(snd.done) return; const i=+b.dataset.i; snd.sel.has(i)?snd.sel.delete(i):snd.sel.add(i); b.classList.toggle("on"); b.setAttribute("aria-pressed",snd.sel.has(i)); });
  $("#sChk").onclick=()=>{
    if(snd.done) return; snd.done=true; const W2=new Set(q.weak), O2=new Set(q.opt); const picked=[...snd.sel].filter(i=>!O2.has(i)); const ok=q.weak.every(i=>snd.sel.has(i)) && picked.every(i=>W2.has(i)); sndScore(ok,$("#sChk"));
    $$("#sPanel .weaktok").forEach(b=>{ const i=+b.dataset.i; b.disabled=true; if(W2.has(i)) b.classList.add(snd.sel.has(i)?"good":"miss"); else if(O2.has(i)) b.classList.add("optw"); else if(snd.sel.has(i)) b.classList.add("bad"); });
    $("#sChk").hidden=true;
    $("#sFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"Spot on. ":"Not quite. The weak words are underlined. "}${esc(q.why)}${q.opt.length?" Words in grey can be weak or strong, so they don't count.":""}</div>
      <div class="row"><button class="btn ghost" type="button" id="sAgain">${ico("sound")} Hear it again</button><button class="btn" type="button" id="sNext">Next sentence</button></div>`;
    $("#sAgain").onclick=()=>sayEn(text,1); $("#sNext").onclick=()=>{ snd.q=null; sndWeak(); }; $("#sNext").focus({preventScroll:true});
  };
}

function sndSay(){
  if(!snd.q){ const cats=sndCats(); const c=cats[rnd0(cats.length)]; const p=c.pairs[rnd0(c.pairs.length)]; snd.q={c, word:p[rnd0(p.length)], other:p}; snd.done=false; snd.heard=""; }
  const q=snd.q;
  const live = !srBlocked;
  $("#sroom").innerHTML=`<div class="panel" id="sPanel">${sndHud()}
    <p class="counter" style="margin:0">${live?"Listen, then press Record and say the word clearly.":"Listen, say the word aloud three times, then compare."}</p>
    <p class="gamebig" style="margin:10px 0">${esc(q.word)}</p>
    <div class="row" style="margin:0 0 12px"><button class="btn ghost" type="button" id="sPlay">${ico("sound")} Listen</button>${live?`<button class="btn sage" type="button" id="sRec">● Record</button>`:""}</div>
    <div id="sFb">${live?"":`<div class="row"><button class="btn" type="button" id="sOk">I said it right</button><button class="btn ghost" type="button" id="sNo">I need more practice</button></div>`}</div>
    <p class="sndtip"><b>${esc(q.c.t)}.</b> ${esc(q.c.tip)}</p>
    <p class="artnote" style="margin:0">${live?"Your browser checks what it heard. In Chrome, the recording is sent to Google to be recognised and isn't kept here.":"Speech checking needs Chrome or Edge on the Psotek website. Here, be your own judge."}</p></div>`;
  $("#sPlay").onclick=()=>sayEn(q.word,0.8);
  const nextBtn=()=>`<button class="btn" type="button" id="sNext">Next word</button>`;
  const wireNext=()=>{ $("#sNext").onclick=()=>{ snd.q=null; sndSay(); }; };
  if(!live){
    $("#sOk").onclick=()=>{ if(snd.done) return; snd.done=true; sndScore(true,$("#sOk")); $("#sFb").innerHTML=`<div class="feedback ok">Great. Try the word in a sentence too.</div><div class="row">${nextBtn()}</div>`; wireNext(); };
    $("#sNo").onclick=()=>{ if(snd.done) return; snd.done=true; snd.seen++; snd.streak=0; $("#sFb").innerHTML=`<div class="feedback no">Listen again slowly and copy the mouth position in the tip.</div><div class="row"><button class="btn ghost" type="button" id="sSlow">${ico("sound")} Slow</button>${nextBtn()}</div>`; $("#sSlow").onclick=()=>sayEn(q.word,0.55); wireNext(); };
    return;
  }
  $("#sRec").onclick=()=>{
    if(srBusy) return; let rec; try{ rec=new SR(); }catch(e){ srBlocked=true; return sndSay(); }
    rec.lang="en-GB"; rec.maxAlternatives=5; rec.interimResults=false; srBusy=true; const btn=$("#sRec"); btn.textContent="Listening…"; btn.disabled=true;
    rec.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript.toLowerCase().replace(/[.,!?]/g,"").trim()); const target=q.word.toLowerCase();
      const ok=alts.some(a=>a===target||a.split(/\s+/).includes(target)); const heard=alts[0]||"";
      if(!snd.done){ snd.done=true; sndScore(ok,btn); }
      const conf=q.other.filter(w=>w.toLowerCase()!==target).find(w=>alts.some(a=>a.split(/\s+/).includes(w.toLowerCase())));
      $("#sFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?`Clear! I heard “${esc(heard)}”.`:conf?`That sounded like <b>${esc(conf)}</b>. Check the tip below and try again.`:`I heard “${esc(heard||"nothing")}”. Try again a little slower.`}</div><div class="row"><button class="btn ghost" type="button" id="sRe">Try again</button>${nextBtn()}</div>`;
      $("#sRe").onclick=()=>{ snd.done=false; sndSay(); }; wireNext(); };
    rec.onerror=e=>{ srBusy=false; if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ srBlocked=true; sndSay(); return; }
      $("#sFb").innerHTML=`<div class="feedback no">I didn't catch that. Press Record and speak a bit louder.</div>`; btn.textContent="● Record"; btn.disabled=false; };
    rec.onend=()=>{ srBusy=false; const b=$("#sRec"); if(b){ b.textContent="● Record"; b.disabled=false; } };
    try{ rec.start(); }catch(e){ srBusy=false; srBlocked=true; sndSay(); }
  };
}

function isoWeekOf(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function setWeeks(s){ try{ const a=new Date(s.start+"T12:00"), b=new Date(s.end+"T12:00"); const wa=isoWeekOf(a), wb=isoWeekOf(b);
  const f=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); return `Weeks ${wa}–${wb} · ${f(a)} – ${f(b)} ${b.getFullYear()}`; }catch(e){ return ""; } }

  el.innerHTML = sets.map(s=>{ const active=VSET.archived && VSET.set===s.set;

    return `<details class="panel archset" ${active?"open":""}><summary><span><b class="archname">${esc(s.label)}</b><small>${esc(setWeeks(s))} · ${s.count||""} words</small></span>${active?'<span class="tag">Practising now</span>':""}</summary>
      <div class="archbody">${lv}<div class="row" style="margin-top:12px">${active?`<button class="btn ghost" type="button" data-setnow>Back to this month's words</button>`:`<button class="btn" type="button" data-arch="${esc(s.set)}">Practise these words</button>`}</div></div></details>`; }).join("");
  $$("[data-arch]").forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent="Loading…"; const ok=await useArchivedSet(b.dataset.arch); if(ok) go("words"); else { b.disabled=false; b.textContent="Couldn't load. Try again"; } });

/* ---------- Today wallpaper: a landscape painted in code; the sky follows the time of day ---------- */
function heroArt(tod){
  const stars = tod==="night" ? Array.from({length:38},(_,i)=>{ const x=(i*317)%1200, y=18+((i*131)%170), r=i%5===0?1.8:1.1; return `<circle cx="${x}" cy="${y}" r="${r}" class="hstar" style="animation-delay:${(i%7)*.6}s"/>`; }).join("") : "";
  const clouds = tod!=="night" ? `<g class="hclouds"><path d="M120 92a26 26 0 0150-8 20 20 0 0136 10 16 16 0 01-2 32H128a20 20 0 01-8-34z"/><path d="M700 58a20 20 0 0138-6 15 15 0 0128 8 12 12 0 01-2 24h-58a15 15 0 01-6-26z"/><path d="M1240 110a24 24 0 0146-7 18 18 0 0132 9 14 14 0 01-2 29h-70a18 18 0 01-6-31z"/></g>` : "";
  const sunY = {morning:150,day:86,evening:196,night:96}[tod], sunX = {morning:880,day:980,evening:1040,night:1010}[tod];
  const tree = (x,y,h)=>`<path d="M${x} ${y}l${-h*.32} ${h*.62}h${h*.2}l${-h*.16} ${h*.3}h${h*.56}l${-h*.16} ${-h*.3}h${h*.2}z"/><rect x="${x-2.5}" y="${y+h*.9}" width="5" height="${h*.22}"/>`;
  const round = (x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/><rect x="${x-2.5}" y="${y+r*.6}" width="5" height="${r*.9}"/>`;
  return `<svg class="heroart" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs><linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="hs1"/><stop offset="1" class="hs2"/></linearGradient>
      <radialGradient id="hglow"><stop offset="0" class="hg1"/><stop offset="1" class="hg2"/></radialGradient></defs>
    <rect width="1200" height="420" fill="url(#hsky)"/>
    ${stars}
    <circle cx="${sunX}" cy="${sunY}" r="120" fill="url(#hglow)"/>
    <circle cx="${sunX}" cy="${sunY}" r="${tod==="night"?30:40}" class="hsun"/>
    ${tod==="night"?`<circle cx="${sunX+13}" cy="${sunY-9}" r="27" class="hmooncut"/>`:""}
    ${clouds}
    ${tod!=="night"?`<g class="hbirds"><path d="M800 150q8-8 16 0q8-8 16 0"/><path d="M842 136q6-6 12 0q6-6 12 0"/><path d="M876 158q5-5 10 0q5-5 10 0"/></g>`:""}
    <path class="hh1" d="M0 280C140 230 260 250 380 236S620 196 760 222s300 6 440-30V420H0z"/>
    <path class="hh2" d="M0 318c160-40 300-28 430-50s260 2 400 20 260-28 370-40V420H0z"/>
    <g class="htree2">${tree(352,232,46)}${tree(388,240,36)}${round(820,250,16)}${tree(1080,236,40)}${tree(1110,246,30)}</g>
    <path class="hh3" d="M0 356c120-26 260-30 400-14s300 30 460 8 250-30 340-24V420H0z"/>
    <g class="htree">${tree(150,300,58)}${tree(196,314,44)}${round(640,330,20)}${round(674,338,14)}${tree(960,316,52)}</g>
    <path class="hh4" d="M0 392c200-22 420-18 620-6s400 10 580-8V420H0z"/>
  </svg>`;
}

/* ---------- Today ---------- */
function pickWeakest(){
  const tried = WORDS.filter(w=>state.stats[w.id].a>=3).sort((a,b)=>acc(a.id)-acc(b.id));
  const fresh = WORDS.filter(w=>state.stats[w.id].a===0);
  if(fresh.length) return fresh[0];
  return tried[0] && acc(tried[0].id)<85 ? tried[0] : WORDS.slice().sort((a,b)=>box(a.id)-box(b.id))[0];
}
const leastUsed = () => WORDS.slice().sort((a,b)=>state.uses[a.id]-state.uses[b.id] || box(a.id)-box(b.id))[0];

  simopp:{t:"Similar or opposite?", d:"Sort related words fast. Builds a web of meaning around each word.", min:2},
  forms:{t:"Word forms", d:"Turn each word into a noun or adverb so it fits the sentence.", min:4},

  mixed:{t:"Mixed review", d:"A bit of everything, shuffled together. The best way to finish a session.", min:6},
  word:{t:"Word round", d:"", min:4}
};
